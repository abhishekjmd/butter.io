<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Figma AI MVP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, -apple-system, sans-serif;
      background: #0f0f13;
      color: #e2e2e9;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid #1e1e2a;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .logo-text {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }

    .logo-sub {
      font-size: 11px;
      color: #6366f1;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .tabs {
      display: flex;
      gap: 2px;
      padding: 16px 20px 0;
    }

    .tab {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      color: #6b6b80;
      cursor: pointer;
      border-radius: 6px 6px 0 0;
      border: none;
      background: transparent;
      transition: all 0.15s;
    }

    .tab.active {
      background: #1a1a24;
      color: #e2e2e9;
      border: 1px solid #2a2a38;
      border-bottom: none;
    }

    .tab-content {
      flex: 1;
      padding: 20px;
      background: #1a1a24;
      border: 1px solid #2a2a38;
      border-top: none;
      overflow-y: auto;
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .tab-content.active {
      display: flex;
    }

    label {
      font-size: 12px;
      font-weight: 600;
      color: #8888a0;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    textarea {
      width: 100%;
      padding: 12px;
      background: #0f0f13;
      border: 1px solid #2a2a38;
      border-radius: 8px;
      color: #e2e2e9;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 12px;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      transition: border 0.15s;
    }

    textarea:focus { border-color: #6366f1; }

    .hint {
      font-size: 11px;
      color: #4a4a60;
      line-height: 1.5;
    }

    .hint code {
      background: #2a2a38;
      padding: 1px 5px;
      border-radius: 3px;
      font-family: monospace;
    }

    .btn {
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
    }

    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .btn-ghost {
      background: #2a2a38;
      color: #a0a0b8;
    }

    .btn-ghost:hover { background: #333344; }

    .status-bar {
      padding: 12px 20px;
      background: #0f0f13;
      border-top: 1px solid #1e1e2a;
      font-size: 12px;
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4a4a60;
      flex-shrink: 0;
    }

    .status-dot.success { background: #22c55e; }
    .status-dot.error { background: #ef4444; }
    .status-dot.loading {
      background: #6366f1;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .status-text { color: #8888a0; }

    .sample-prompts {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sample-chip {
      padding: 8px 12px;
      background: #0f0f13;
      border: 1px solid #2a2a38;
      border-radius: 6px;
      font-size: 12px;
      color: #8888a0;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
    }

    .sample-chip:hover {
      border-color: #6366f1;
      color: #e2e2e9;
    }

    .api-key-input {

      background: #0f0f13;
      border: 1px solid #2a2a38;
      border-radius: 8px;
      color: #e2e2e9;
      font-family: monospace;
      font-size: 13px;
      outline: none;
    }

    .api-key-input:focus { border-color: #6366f1; }

    .row { display: flex; gap: 8px; }
    .row .btn { flex: 1; }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">Ã¢Å“Â¦</div>

<!-- TAB: Paste Schema -->
<div class="tab-content active" id="tab-paste">

{

<!-- TAB: AI Generate -->
<div class="tab-content" id="tab-generate">

  <div class="sample-prompts">

      Modern SaaS landing page with hero, features (3 cols), pricing (3 tiers), footer
    </button>

    </button>
    <button class="sample-chip" onclick="setPrompt(this)">
      Startup landing page with bold hero, stats section, feature cards and email signup CTA
    </button>
  </div>

  <button class="btn btn-primary" id="generate-btn" onclick="generateFromPrompt()">
    Ã¢Å“Â¦ Generate with AI

<!-- Status Bar -->
<div class="status-bar">
  <div class="status-dot" id="status-dot"></div>
  <div class="status-text" id="status-text">Ready to generate</div>

<script>
  function switchTab(name) {
    document.querySelectorAll('.tab').forEach((t, i) => {
      t.classList.toggle('active', ['paste','generate'][i] === name)
    })
    document.querySelectorAll('.tab-content').forEach(c => {
      c.classList.toggle('active', c.id === `tab-${name}`)
    })
  }

  function setStatus(type, message) {
    const dot = document.getElementById('status-dot')
    const text = document.getElementById('status-text')
    dot.className = `status-dot ${type}`
    text.textContent = message
    text.style.color = type === 'error' ? '#ef4444' : type === 'success' ? '#22c55e' : '#8888a0'
  }

  function setPrompt(el) {
    document.getElementById('prompt-input').value = el.textContent.trim()
  }

  function generateFromPaste() {
    const raw = document.getElementById('schema-input').value.trim()
    if (!raw) { setStatus('error', 'Please paste a schema JSON first'); return }

    let schema
    try {
      schema = JSON.parse(raw)
    } catch(e) {
      setStatus('error', `JSON parse error: ${e.message}`)
      return
    }

    setStatus('loading', 'Generating Figma design...')
    parent.postMessage({ pluginMessage: { type: 'GENERATE', schema } }, '*')
  }

  async function generateFromPrompt() {
    const apiKey = document.getElementById('api-key').value.trim()
    const prompt = document.getElementById('prompt-input').value.trim()

    if (!apiKey) { setStatus('error', 'Enter your Anthropic API key'); return }
    if (!prompt) { setStatus('error', 'Enter a prompt'); return }

    const btn = document.getElementById('generate-btn')
    btn.disabled = true
    btn.textContent = 'Ã¢ÂÂ³ Calling Claude...'
    setStatus('loading', 'Calling Claude API...')

    try {
      const systemPrompt = await getSystemPrompt()
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 4096,
          system: systemPrompt,
          messages: [{ role: 'user', content: prompt }]
        })
      })

      if (!response.ok) {
        const err = await response.json()
        const apiErrorMessage = err && err.error && err.error.message
          ? err.error.message
          : ('HTTP ' + response.status)
        throw new Error(apiErrorMessage)
      }

      const data = await response.json()
      const raw = data.content.map(b => (b && b.text) ? b.text : '').join('')
      const cleaned = raw.replace(/^```json\s*/i,'').replace(/^```\s*/i,'').replace(/\s*```$/,'').trim()
      const schema = JSON.parse(cleaned)

      // Show the schema in paste tab too
      document.getElementById('schema-input').value = JSON.stringify(schema, null, 2)

      setStatus('loading', 'Generating Figma design...')
      parent.postMessage({ pluginMessage: { type: 'GENERATE', schema } }, '*')

    } catch(err) {
      setStatus('error', err.message)
    } finally {
      btn.disabled = false
      btn.textContent = 'Ã¢Å“Â¦ Generate with AI'
    }
  }

  // Load system prompt from the text file (in real app, this would be hardcoded)
  async function getSystemPrompt() {
    // Hardcoded minimal system prompt for MVP plugin usage
    return `You are a UI layout designer. Output ONLY valid JSON matching this schema.
No markdown, no backticks. Raw JSON only.

Rules:
- spacing values: 4|8|12|16|24|32|48|64|80
- color tokens: "primary"|"primary-dark"|"primary-light"|"text-primary"|"text-secondary"|"text-muted"|"text-inverse"|"bg-page"|"bg-surface"|"bg-surface-raised"|"border"|"border-subtle"|"success"|"warning"|"error"|"white"|"black"|"transparent"
- font styles: "display"|"h1"|"h2"|"h3"|"body-lg"|"body"|"caption"|"label"
- fontFamily: "Inter"|"Plus Jakarta Sans"|"Geist"
- borderRadius: 4|8|12|16|24
- primaryColor: valid 6-digit hex like "#6366F1"

Schema structure:
{
  "schemaVersion": "1.0",
  "page": "string",
  "description": "string",
  "tokens": { "fontFamily": "Inter", "borderRadius": 8, "primaryColor": "#6366F1", "style": "modern" },
  "sections": [
    {
      "id": "unique-id",
      "type": "navbar|hero|features|pricing|testimonials|cta|footer|faq|stats|logos",
      "layout": "vertical|horizontal|grid",
      "padding": spacing,
      "gap": spacing,
      "columns": number (for grid sections),
      "background": colorToken,
      "align": "left|center|right",
      "children": [ ...components ]
    }
  ]
}

Component types:
- { "type": "text", "content": "...", "style": fontStyle, "color": colorToken, "align": "left|center|right", "maxWidth": number }
- { "type": "button", "label": "...", "variant": "primary|secondary|ghost|outline", "size": "sm|md|lg" }
- { "type": "badge", "label": "...", "color": colorToken }
- { "type": "image", "width": number, "height": number, "shape": "rectangle|rounded|circle", "label": "..." }
- { "type": "input", "placeholder": "...", "width": number }
- { "type": "divider" }
- { "type": "card", "variant": "default|featured|outlined|ghost", "padding": spacing, "gap": spacing, "children": [...] }

Always include: navbar, hero (with display text + body-lg + button + image), features grid (3 cards), pricing grid (3 cards, one "featured"), footer.`
  }

  // Listen for messages from main thread
  window.onmessage = (event) => {
    const msg = event.data.pluginMessage
    if (!msg) return
    if (msg.type === 'SUCCESS') setStatus('success', msg.message)
    if (msg.type === 'ERROR') setStatus('error', `Error: ${msg.message}`)
    if (msg.type === 'STATUS') setStatus('loading', msg.message)
  }
